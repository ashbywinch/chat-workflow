[project]
name = "chat-workflow"
version = "0.1.0"
description = "Framework for building structured LLM conversation workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.15.1",
    "litellm>=1.58.15",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "typer>=0.24.1",
]

[project.scripts]
chat-workflow = "chat_workflow.cli:app"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chat_workflow*", "workflows*"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "coverage>=7.0.0",
    "python-lsp-server>=1.12.0",
    "ruff>=0.11.0",
]

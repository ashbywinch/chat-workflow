[project]
name = "prompt-core"
version = "0.1.0"
description = "Framework for building structured LLM conversation workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.15.1",
    "litellm>=1.58.15",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "typer>=0.24.1",
]

[project.scripts]
prompt-core = "prompt_core.cli:main"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["prompt_core*", "evaluation_criteria*"]

[project.optional-dependencies]
dev = [
    "black>=24.0.0",
    "coverage>=7.0.0",
    "ruff>=0.11.0",
]

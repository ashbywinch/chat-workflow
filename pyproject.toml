# Virtual workspace root — deliberately NO `[project]` table.
#
# The installable packages live under `packages/`; each owns its `[project]`,
# build backend, and source tree. This file holds the workspace membership and
# the tool configuration shared by every member (ruff, coverage) plus the dev
# dependency group.
#
# DO NOT CHANGE:
# - Keep `[tool.ruff]` and `[tool.coverage]` here: ruff reads the nearest
#   config walking up from each file, so one root config keeps every package on
#   the same rules.
# - Coverage `source` stays module-based: the module names did not change when
#   the sources moved to `src/`, so the denominator follows the packages.

[tool.uv.workspace]
members = ["packages/*"]

[tool.ruff]
# Target version for modern syntax (e.g., f-strings, type unions)
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# "Select" defines which rule sets to run.
# E, F: Default (Flake8 errors/warnings)
# I: Isort (keeps imports organized)
# UP: Pyupgrade (forces modern Python syntax)
# B: Bugbear (catches common design flaws)
# SIM: Simplify (suggests cleaner logic)
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# UP046/UP047: type parameter syntax (PEP 695) — skipped as it would break
# runtime reflection that inspects Generic[TResult] / TypeVar patterns.
ignore = ["UP046", "UP047"]

# "Fixable" allows Ruff to automatically rewrite the code for you
fixable = ["ALL"]

[tool.ruff.lint.isort]
# First-party detection cannot rely on `src = ["."]` once the packages live in
# `packages/*/src/`; name the modules explicitly so import grouping is stable
# and identical for every workspace member.
known-first-party = ["chat_workflow", "chat_workflow_cli", "tests", "workflows"]

[dependency-groups]
dev = [
    "code-review-graph>=2.3.3",
    "coverage>=7.0.0",
    "pyrefly>=1.4.1",
    "python-lsp-server>=1.12.0",
    "ruff>=0.11.0",
]

[tool.coverage.run]
source = ["chat_workflow", "workflows", "chat_workflow_cli"]

[tool.coverage.report]
show_missing = true

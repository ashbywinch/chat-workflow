[project]
name = "chat-workflow"
version = "0.1.0"
description = "Framework for building structured LLM conversation workflows"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "instructor>=1.15.1",
    "litellm>=1.58.15",
    "pydantic>=2.13.3",
    "python-dotenv>=1.2.2",
    "typer>=0.24.1",
]

[project.scripts]
chat-workflow = "chat_workflow.cli:app"

[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chat_workflow*", "workflows*"]

[tool.ruff]
# Target version for modern syntax (e.g., f-strings, type unions)
target-version = "py312"
line-length = 120

[tool.ruff.lint]
# "Select" defines which rule sets to run.
# E, F: Default (Flake8 errors/warnings)
# I: Isort (keeps imports organized)
# UP: Pyupgrade (forces modern Python syntax)
# B: Bugbear (catches common design flaws)
# SIM: Simplify (suggests cleaner logic)
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# UP046/UP047: type parameter syntax (PEP 695) — skipped as it would break
# runtime reflection that inspects Generic[TResult] / TypeVar patterns.
ignore = ["UP046", "UP047"]

# "Fixable" allows Ruff to automatically rewrite the code for you
fixable = ["ALL"]

[project.optional-dependencies]
dev = [
    "coverage>=7.0.0",
    "python-lsp-server>=1.12.0",
    "ruff>=0.11.0",
]

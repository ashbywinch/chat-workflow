# Dependabot auto-merge — patch/minor dependabot PRs merge themselves once
# required checks pass.
#
# DO NOT CHANGE:
# - The semver gate: majors stay human (CI green is not compatibility).
# - github-actions bumps are never auto-merged: action ref bumps are pin
#   updates per the coding standard and need the SHA-pin treatment by a human.
# - The trigger is pull_request_target, NOT pull_request: dependabot-triggered
#   pull_request runs get a read-only token and NO secrets.
# - Safety invariant: this job must NEVER execute PR-controlled code or data
#   — no checkout of the PR head/merge ref, no PR title/body/branch name/label
#   interpolated into run:/env:/with:.
# - Allow auto-merge must be enabled in the repo: Settings -> General ->
#   Pull Requests -> Allow auto-merge.

name: Dependabot auto-merge

on: pull_request_target

jobs:
  dependabot:
    runs-on: ubuntu-latest
    # job-level, not workflow-level: a future job must not silently inherit
    # write permissions (least privilege).
    permissions:
      contents: write # the auto-merge performs the merge
      pull-requests: write # enabling auto-merge on the PR
    if: github.actor == 'dependabot[bot]'
    steps:
      - name: Fetch dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: "${{ secrets.GITHUB_TOKEN }}"
      - name: Enable auto-merge for patch and minor updates
        if: ${{ steps.metadata.outputs.package-ecosystem != 'github_actions' && (steps.metadata.outputs.update-type == 'version-update:semver-patch' || steps.metadata.outputs.update-type == 'version-update:semver-minor') }}
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr merge --auto --merge "$PR_URL"

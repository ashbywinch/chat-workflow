# Caller for the house PR auto-merge. The App credentials are repo settings,
# not tree state:
#   gh variable set OMP_APP_ID --repo <owner>/<name> --body <app-id>
#   gh secret set OMP_APP_PRIVATE_KEY --repo <owner>/<name> < app-private-key.pem
# The App needs Contents: write, Pull requests: write and Actions: write, and
# must be installed on the repo. Until OMP_APP_ID is set the job skips, so the
# gate is visible but does not fail every PR on an unconfigured repo.
name: PR auto-merge

on:
  pull_request:
    types: [opened, reopened, ready_for_review, synchronize]
  pull_request_review:
    types: [submitted]
  push:
    branches: [main]
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

jobs:
  automerge:
    if: ${{ vars.OMP_APP_ID != '' }}
    permissions:
      contents: read
    uses: ashbywinch/omp-config/.github/workflows/pr-automerge.yml@v0.2.7
    with:
      app_id: ${{ vars.OMP_APP_ID }}
    secrets:
      app_private_key: ${{ secrets.OMP_APP_PRIVATE_KEY }}

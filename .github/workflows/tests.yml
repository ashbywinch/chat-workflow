# CI — delegates to make, never raw tool commands.
#
# Pipeline logic is make-only: anything deciding what ships or what the run
# concludes lives behind a make target. Tool bootstrap and result plumbing
# (checkout, setup-*, upload-artifact, coverage reporting/commenting) are the
# only workflow steps allowed to be raw.
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo cancels superseded runs.
# - Lint runs via `make lint-github` so findings surface as PR annotations.
# - Actions pin to a commit SHA with the version as a trailing comment.

name: CI
on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  schedule:
    - cron: '0 3 * * 1'   # the weekly conversation run
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make install
      - run: make lint-github
      - run: make actionlint
      - run: make test
      - run: make gitleaks
      - run: make dist
      - name: Upload dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: dist
          path: dist/
      - run: make coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '85 90'
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: ${{ github.event_name == 'pull_request' && !cancelled() && hashFiles('code-coverage-results.md') != '' }}
        with:
          recreate: true
          path: code-coverage-results.md
      # Last, so a red code-health gate does not hide the test, coverage,
      # lint and artifact results above it.
      - run: make check

  conversation-evals:
    # The full conversation suite calls real models and an LLM judge. It is a
    # required merge check and a release requirement: a PR does not merge with
    # a red run, and a release tag requires green. A judge sample is not
    # deterministic, so a failure is investigated and re-run; it is never
    # merged past unexamined.
    if: >-
      (github.event_name == 'pull_request' &&
       github.event.pull_request.head.repo.fork != true &&
       github.actor != 'dependabot[bot]') ||
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    # Least privilege: the evals job reads the checkout and uploads its
    # transcript artifact; it has no reason to write pull requests.
    permissions:
      contents: read
    # Above the wrapper's own EVAL_TIMEOUT (4 h), so the suite's deadline fires
    # first and the job is not killed mid-run by the runner.
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make install
      - name: Conversation suite
        env:
          OPENAI_API_KEY: ${{ secrets.CHAT_WORKFLOW_API_KEY }}
          OPENAI_BASE_URL: ${{ vars.OPENAI_BASE_URL }}
          CHAT_WORKFLOW_TRANSCRIPT_DIR: test-results/transcripts
          CHAT_WORKFLOW_EVAL_REPORT: 1
          EVAL_TIMEOUT: 14400
        run: make evals
      - name: Upload eval transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: |
            test-results/transcripts/
            test-results/eval-report.txt
          if-no-files-found: ignore

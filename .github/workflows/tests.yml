# CI — delegates to make, never raw tool commands.
#
# Pipeline logic is make-only: anything deciding what ships or what the run
# concludes lives behind a make target. Tool bootstrap and result plumbing
# (checkout, setup-*, upload-artifact, coverage reporting/commenting) are the
# only workflow steps allowed to be raw.
#
# DO NOT CHANGE:
# - `permissions: contents: read` (+ `pull-requests: write` only while the
#   coverage-comment step is present — drop both together if you drop it).
# - The concurrency group: every active repo cancels superseded runs.
# - Lint runs via `make lint-github` so findings surface as PR annotations.
# - Actions pin to a commit SHA with the version as a trailing comment.

name: CI
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: write   # the coverage comment step needs it; drop if you drop that step
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - run: make setup
      - run: make lint-github
      - name: Workflow syntax (actionlint)
        # An invalid workflow fails every push with no jobs and only a
        # banner. This turns that into a normal red PR check.
        run: |
          curl -sSfL https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz -o /tmp/actionlint.tgz
          tar -xzf /tmp/actionlint.tgz -C /tmp actionlint
          /tmp/actionlint -color .github/workflows/*.yml
      - name: Docs links
        run: make docs-check
      - run: make test
      - name: Secret scan
        # Reads git objects, so every committed file is covered — not just the diff.
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o gitleaks.tgz
          tar -xzf gitleaks.tgz gitleaks
          ./gitleaks git --no-banner -v
      - run: make coverage
      - name: Coverage summary
        uses: irongut/CodeCoverageSummary@51cc3a756ddcd398d447c044c02cb6aa83fdae95 # v1.3.0
        with:
          filename: coverage.xml
          badge: true
          fail_below_min: true
          thresholds: '85 90'
          format: markdown
          output: both
      - name: Post coverage comment
        uses: marocchino/sticky-pull-request-comment@773744901bac0e8cbb5a0dc842800d45e9b2b405 # v2.9.4
        if: ${{ github.event_name == 'pull_request' && !cancelled() && hashFiles('code-coverage-results.md') != '' }}
        with:
          recreate: true
          path: code-coverage-results.md
      - name: Evaluation tests
        # Evals call a real LLM through Cloudflare AI Gateway. Dependabot PRs
        # and forked PRs get no secrets, so the step can only fail there —
        # skip it for them and always run it on main.
        if: ${{ github.actor != 'dependabot[bot]' && github.event.pull_request.head.repo.fork != true }}
        env:
          OPENAI_API_KEY: ${{ secrets.CHAT_WORKFLOW_API_KEY }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
          CHAT_WORKFLOW_TRANSCRIPT_DIR: test-results/transcripts
          CHAT_WORKFLOW_EVAL_REPORT: 1
        run: make evals
      - name: Upload eval transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: eval-results
          path: |
            test-results/transcripts/
            test-results/eval-report.txt
          if-no-files-found: ignore

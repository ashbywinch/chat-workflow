name: CI

on:
  push:
  workflow_dispatch:

concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup and install dependencies
        run: make setup
      
      - name: Lint
        run: make lint
      
      - name: Unit tests
        run: make test
      
      - name: Evaluation tests
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENCODE_GO_EVALS_API_KEY: ${{ secrets.OPENCODE_GO_EVALS_API_KEY }}
          CHAT_WORKFLOW_TRANSCRIPT_DIR: test-results/transcripts
          CHAT_WORKFLOW_EVAL_REPORT: 1
        run: make evals
      
      - name: Upload eval transcripts
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: |
            test-results/transcripts/
            test-results/eval-report.txt

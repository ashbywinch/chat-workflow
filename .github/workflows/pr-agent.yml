# AI Code Review (the-pr-agent) — the house review bot.
#
# The secret CHAT_WORKFLOW_API_KEY holds the Cloudflare AI Gateway token
# (same token for every project); OPENAI_BASE_URL points at the gateway so
# reviews route through OpenCode -> DeepSeek failover.
#
# DO NOT CHANGE:
# - NO actions/checkout in the pr-review job — deliberate. PR-Agent fetches
#   everything via the GitHub API (the pinned config branch, the diff, the
#   repo context files), and the action's config loader ALSO merges a
#   [tool.pr-agent] section from pyproject.toml found in the working tree.
#   With a checkout of the PR head, an attacker branch could ship its own
#   pyproject.toml overriding [openai] api_base.
# - PR_AGENT_CONFIG_BRANCH: config MUST come from a maintainer-controlled
#   branch — a PR branch could ship its own .pr_agent.toml pointing api_base
#   at an attacker endpoint, and the API key would be sent there as the
#   Bearer token. Missing pin, not the key, is the first thing to check when
#   "Incorrect API key" appears.
# - The verify job checks out the DEFAULT branch, not the PR head — the
#   script runs with GITHUB_TOKEN, and a PR could replace
#   tools/check_review_posted.py with code that exfiltrates it. python3 -I
#   only blocks stdlib shadowing.

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

jobs:
  pr-review:
    runs-on: ubuntu-latest
    # Dependabot bumps are mechanical and already covered by build-and-test;
    # the AI review adds noise (and their descriptions lack a ticket ref).
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - uses: the-pr-agent/pr-agent@d265b4250d1d532e35b4428454b665b56b57e9c6 # v0.41.1
        id: pr-agent
        env:
          OPENAI_KEY: ${{ secrets.CHAT_WORKFLOW_API_KEY }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_AGENT_CONFIG_BRANCH: pr-agent-config

  verify:
    # A SEPARATE job that runs AFTER the bot job completes: GitHub does not
    # serve a job's log until it finishes, so check_review_posted.py can only
    # read the bot's failure reason from here.
    needs: pr-review
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read   # read the bot's completed run log for the failure reason
    steps:
      # SECURITY: checkout the DEFAULT branch, not the PR head.
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Fail loud if no review covers the head commit
        env:
          SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # python3 -I (isolated) keeps the checkout off sys.path — a repo-root
        # json.py/urllib.py/sitecustomize.py must not shadow the script's
        # stdlib imports and run code with GITHUB_TOKEN.
        run: python3 -I tools/check_review_posted.py

name: AI Code Review

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

# One review at a time per PR. A running review is never cancelled: a
# cancelled run leaves its head with no review check run, so the gate stays red
# on code nobody read. GitHub still replaces a *pending* run when a newer push
# arrives; the surviving run reviews the newer head, which is what the gate
# reads.
concurrency:
  group: ai-review-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  pr-review:
    runs-on: ubuntu-latest
    if: github.event.pull_request.user.login != 'dependabot[bot]'
    permissions:
      contents: read
      pull-requests: write
      issues: write
      checks: write # the bot publishes its review as a check run (github.publish_as_check_run)
    steps:
      # NO actions/checkout here — deliberate. PR-Agent fetches everything via
      # the GitHub API (the pinned config branch, the diff, the repo context
      # files), and the action's config loader ALSO merges a [tool.pr-agent]
      # section from pyproject.toml found in the working tree. With a checkout
      # of the PR head, an attacker branch could ship its own pyproject.toml
      # overriding [openai] api_base; with no checkout there is no working-tree
      # config to read at all.
      - uses: the-pr-agent/pr-agent@d265b4250d1d532e35b4428454b665b56b57e9c6
        # Same pinned commit as the-loft: the first whose GitHub provider
        # implements the inline key-issue API that pr_reviewer.inline_key_issues
        # needs. @latest does not resolve; pin a release SHA.
        id: pr-agent
        env:
          # The house gateway, the same lane the evals use. This repo's gateway
          # token lives in CHAT_WORKFLOW_API_KEY, not OPENAI_API_KEY.
          OPENAI_KEY: ${{ secrets.CHAT_WORKFLOW_API_KEY }}
          OPENAI_BASE_URL: https://gateway.ai.cloudflare.com/v1/e21a5be58ac1e8f7d5619539feb2dc3d/default/compat
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # SECURITY: the config comes from a pinned branch, never the PR head
          # (a same-repo branch could ship its own api_base/config and
          # exfiltrate the key). chat-workflow has no pr-agent-config branch,
          # so this names the default branch explicitly rather than relying on
          # a 404 fallback.
          PR_AGENT_CONFIG_BRANCH: main
